apiVersion: v1
kind: Service
metadata:
  name: php-demo-app
  namespace: default
  labels:
    app: php-demo-app
spec:
  selector:
    app: php-demo-app
  ports:
    - protocol: TCP
      port: 80          # Port exposed by the Service
      targetPort: 80    # Port inside the container
  # Use NodePort for easy access in a local cluster (e.g., Minikube)
  # Change to LoadBalancer if deploying to a cloud provider (AWS, GCP, Azure)
  type: NodePort